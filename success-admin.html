<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>
    <div class="h-screen bg-blue-600 flex flex-col items-center justify-center relative">
        <div class="absolute top-8 left-10 text-white text-2xl font-bold">Logo</div>

        <lottie-player
            src="https://assets1.lottiefiles.com/packages/lf20_jbrw3hcz.json"
            background="transparent"
            speed="1"
            style="width: 500px; height: 500px;"
            loop
            autoplay>
        </lottie-player>

        <h2 class="text-3xl font-bold text-red-500 mt-4">Successful Admin</h2>
    </div>
</body>
</html>
